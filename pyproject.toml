[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-workbench"
version = "0.1.0"
description = "A modular tabular AutoML experimentation workbench"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.37,<2.0",
  "pandas>=2.0,<4.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.4,<1.10",
  "openpyxl>=3.1",
  "joblib>=1.3",
  "plotly>=5.20",
]

[tool.setuptools.packages.find]
include = ["ml_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
